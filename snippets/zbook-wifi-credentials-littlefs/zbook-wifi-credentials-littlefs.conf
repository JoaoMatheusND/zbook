# Wi-Fi credentials persisted via the settings FILE backend on LittleFS.
#
# Use this instead of the upstream `wifi-credentials` snippet: that snippet hard
# selects CONFIG_SETTINGS_NVS=y, and SETTINGS_BACKEND is a Kconfig choice, so the
# only way to switch to the file backend is to not pull NVS in at all.
#
# The LittleFS mount itself (fstab node on the `storage` partition, served at
# /lfs) is described by the board's devicetree (zbook_rp2350b_m33-common.dtsi).
# The application must still pull the littlefs module into its west manifest
# (name-allowlist: littlefs).
#
#   west build -p always -b zbook/rp2350b/m33 --shield zbook_wifi \
#       -S zbook-wifi-credentials-littlefs

CONFIG_WIFI_CREDENTIALS=y

# Flash map: LittleFS and the settings file backend live on a flash partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# LittleFS, auto-mounted on the board's `storage` partition at /lfs.
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# Mount /lfs before wifi_credentials inits. The fstab automount runs at
# POST_KERNEL/FILE_SYSTEM_INIT_PRIORITY (default 99), but wifi_credentials inits
# at POST_KERNEL/APPLICATION_INIT_PRIORITY (90) and reads the settings file at
# init — so /lfs must be mounted earlier. 80 sits after the RP2350 flash driver
# (FLASH_INIT_PRIORITY=50) and before 90.
CONFIG_FILE_SYSTEM_INIT_PRIORITY=80

# Settings stored in a file on that LittleFS mount, instead of CONFIG_SETTINGS_NVS.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/lfs/settings"
