sample:
  name: ZBook Lua UART
tests:
  sample.zbook.lua_uart:
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "uart.cfg  err=0"
        - "uart.init err=0"
        - "uart.write err=0"
    platform_allow: zbook/rp2350b/m33
    integration_platforms:
      - zbook/rp2350b/m33
    tags:
      - zbook
      - lua
      - uart
